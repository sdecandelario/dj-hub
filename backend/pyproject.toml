[project]
name = "dj-hub"
version = "0.1.0"
description = "Local app for the DJ library: Spotify playlists, downloads review, loudness analysis and library moves."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "watchfiles>=0.24",
    "mutagen>=1.48.1",
]

[project.scripts]
djhub = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.17.5",
    "httpx2>=2.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["app/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "E731", "E741", "B008", "B904", "B905"]   # long lines are fine; lambdas for short helpers; Depends() in signatures
